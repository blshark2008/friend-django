server {
    # Nginx конфиг для сервера 84.54.59.213
    # Проксирует запросы на локальный Django через SSH reverse tunnel
    
    listen 443 ssl http2;
    server_name 84.54.59.213 projectgame.ru www.projectgame.ru;

    # Self-signed SSL сертификат
    ssl_certificate     /etc/nginx/ssl/friend.crt;
    ssl_certificate_key /etc/nginx/ssl/friend.key;
    
    # Настройки SSL
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Webhook endpoint для MAX API
    location /max/webhook/ {
        proxy_pass http://127.0.0.1:8000/max/webhook/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Таймауты для webhook
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        
        # Размер тела запроса
        client_max_body_size 10M;
    }

    # Training webhook endpoint
    location /training/ {
        proxy_pass http://127.0.0.1:8000/training/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Таймауты для webhook
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        
        # Размер тела запроса
        client_max_body_size 10M;
    }

    # API endpoint (если нужен)
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Статус nginx
    location /nginx-health {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    # Блокировка доступа к скрытым файлам
    location ~ /\. {
        deny all;
    }
}

# HTTP → HTTPS редирект
server {
    listen 80;
    server_name 84.54.59.213 projectgame.ru www.projectgame.ru;
    
    location /max/webhook/ {
        return 301 https://$host$request_uri;
    }
    
    location /training/ {
        return 301 https://$host$request_uri;
    }
    
    location /api/ {
        return 301 https://$host$request_uri;
    }
}
