{% extends "access/base.html" %}

{% block title %}Удаление контейнера — «Друг»{% endblock %}

{% block page_title %}
<h4 class="mb-0"><i class="bi bi-trash me-2"></i>Удаление контейнера групп</h4>
{% endblock %}

{% block content %}
<div class="card shadow-sm">
    <div class="card-body">
        <div class="alert alert-warning">
            <i class="bi bi-exclamation-triangle me-2"></i>
            Вы уверены, что хотите архивировать контейнер групп «{{ container.name }}»?
        </div>
        <form method="post">
            {% csrf_token %}
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-danger">
                    <i class="bi bi-trash"></i> Архивировать
                </button>
                <a href="{% url 'access:container_list' %}" class="btn btn-outline-secondary">
                    <i class="bi bi-x-lg"></i> Отмена
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
