<td class="text-muted">{{ forloop.counter }}</td>
<td>
    <a href="{% url 'accounts:user_general' user.pk %}" class="text-decoration-none fw-semibold">
        {{ user.last_name }} {{ user.first_name }}{% if user.patronymic %} {{ user.patronymic }}{% endif %}
    </a>
</td>
<td>{{ user.tab_number|default:"—" }}</td>
<td>{{ user.department.name|default:"—" }}</td>
<td>{{ user.position.name|default:"—" }}</td>
<td>
    <form method="post" action="{% url 'accounts:internal_group_remove_user' group.pk %}" class="d-inline" onsubmit="return confirm('Удалить пользователя из группы?')">
        {% csrf_token %}
        <input type="hidden" name="user_id" value="{{ user.pk }}">
        <button type="submit" class="btn btn-sm btn-outline-danger" title="Удалить из группы">
            <i class="bi bi-person-x"></i>
        </button>
    </form>
</td>
