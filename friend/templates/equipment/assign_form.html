{% extends 'base.html' %}

{% block title %}Закрепить оборудование{% endblock %}

{% block page_title %}
<h4 class="mb-0"><i class="bi bi-link-45deg me-2"></i>Закрепить оборудование</h4>
{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card table-card">
            <div class="card-header">
                <h6 class="mb-0"><i class="bi bi-person-badge me-2"></i>Новое назначение</h6>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Пользователь</label>
                        <input type="text" class="form-control" value="{{ user.get_full_name|default:user.username }}" disabled>
                        <input type="hidden" name="user_id" value="{{ user.pk }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Тип оборудования</label>
                        <select name="equipment_type" class="form-select" required>
                            <option value="">— Выберите тип —</option>
                            {% for value, label in equipment_types %}
                            <option value="{{ value }}">{{ label }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">ID оборудования</label>
                        <input type="number" name="equipment_id" class="form-control" placeholder="Введите ID" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Примечание</label>
                        <textarea name="notes" class="form-control" rows="3" placeholder="Необязательно"></textarea>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Закрепить</button>
                        <a href="{% url 'equipment:dashboard' %}" class="btn btn-outline-secondary">Отмена</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
