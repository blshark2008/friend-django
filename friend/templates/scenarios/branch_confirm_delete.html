{% extends "base.html" %}
{% load static %}

{% block title %}Удаление ветки — «Друг»{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card border-0 shadow-sm">
            <div class="card-header bg-white">
                <h5 class="mb-0 text-danger"><i class="bi bi-exclamation-triangle me-2"></i>Удаление ветки</h5>
            </div>
            <div class="card-body p-4">
                <p class="mb-3">Вы уверены, что хотите удалить ветку «{{ object.name }}» ({{ object.code }}) и все её шаги?</p>

                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-danger">
                            <i class="bi bi-trash me-1"></i>Удалить
                        </button>
                        <a href="{{ cancel_url }}" class="btn btn-outline-secondary">
                            Отмена
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
