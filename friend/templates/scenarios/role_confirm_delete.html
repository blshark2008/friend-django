{% extends "scenarios/base.html" %}
{% load static %}

{% block title %}Удаление роли — «{{ object.name }}» — «Друг»{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card border-0 shadow-sm">
            <div class="card-header bg-danger text-white">
                <h5 class="mb-0">
                    <i class="bi bi-exclamation-triangle me-2"></i>Удаление роли
                </h5>
            </div>
            <div class="card-body p-4">
                <p class="mb-3">Вы действительно хотите удалить роль <strong>{{ object.name }}</strong>?</p>

                <div class="alert alert-warning">
                    <i class="bi bi-info-circle me-1"></i>
                    Это действие необратимо.
                </div>

                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-danger">
                            <i class="bi bi-trash me-1"></i>Удалить роль
                        </button>
                        <a href="{% url 'scenarios:role_list' %}" class="btn btn-outline-secondary">
                            Отмена
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
