{% extends "base.html" %}
{% load static %}

{% block title %}Обучение — Удаление типа{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card border-0 shadow-sm">
            <div class="card-header bg-white">
                <h5 class="mb-0">
                    <i class="bi bi-trash me-2"></i>Удаление типа обучения
                </h5>
            </div>
            <div class="card-body">
                <p>Вы действительно хотите удалить тип обучения "<strong>{{ obj.name }}</strong>"?</p>
                
                <hr>
                <div class="d-flex gap-2">
                    <form method="post" class="d-inline">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-danger">
                            <i class="bi bi-trash me-1"></i>Удалить
                        </button>
                    </form>
                    <a href="{% url 'training:type_list' %}" class="btn btn-secondary">
                        <i class="bi bi-x-lg me-1"></i>Отмена
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
