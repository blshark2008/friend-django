{% extends "base.html" %}
{% load static %}

{% block title %}Обучение — Удаление{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card border-0 shadow-sm border-danger">
            <div class="card-header bg-danger text-white">
                <h5 class="mb-0"><i class="bi bi-exclamation-triangle me-2"></i>Подтверждение удаления</h5>
            </div>
            <div class="card-body">
                <p class="mb-3">Вы уверены, что хотите удалить тип обучения <strong>"{{ obj.name }}"</strong>?</p>
                <p class="text-muted small">Все связанные назначения обучения также будут удалены.</p>
                
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-danger">
                            <i class="bi bi-trash me-1"></i>Удалить
                        </button>
                        <a href="{% url 'training:type_list' %}" class="btn btn-secondary">
                            <i class="bi bi-x-lg me-1"></i>Отмена
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
